name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Preview from the GitHub project URL. Once maryamattar.co is connected
      # (DEPLOY.md, step 4) change these two lines to
      #   NEXT_PUBLIC_SITE_URL: https://maryamattar.co
      #   NEXT_PUBLIC_BASE_PATH: ""
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://mattar23.github.io/Mix-Website
          NEXT_PUBLIC_BASE_PATH: /Mix-Website
          # Web3Forms access key for the contact form, delivering to info@. Public by design. Empty: the form opens the mail client.
          NEXT_PUBLIC_FORM_KEY: "2b0e89d0-6b68-49b6-ab54-7c434b7d0624"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
